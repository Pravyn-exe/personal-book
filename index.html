<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Book</title>
    <!-- This makes it feel like a real app when added to homescreen -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass-card { background: white; border-radius: 28px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    </style>
</head>
<body class="p-4">
    <div class="max-w-md mx-auto">
        <div class="glass-card p-6 mt-4">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-xl font-black text-slate-800 tracking-tight">PERSONAL BOOK</h1>
                <div id="date-label" class="bg-slate-900 text-white px-3 py-1 rounded-lg text-[10px] font-bold">MAY 2026</div>
            </div>

            <!-- Balance Card -->
            <div class="bg-slate-900 rounded-3xl p-6 text-white mb-6 shadow-xl">
                <p class="text-[10px] opacity-60 uppercase tracking-widest font-bold">Available to Spend</p>
                <div class="text-4xl font-bold mt-1">₹<span id="display-remaining">0</span></div>
                <div class="mt-4 grid grid-cols-2 gap-4 text-[11px] border-t border-slate-700 pt-4">
                    <div><span class="opacity-50">BUDGET:</span> ₹<span id="display-budget">0</span></div>
                    <div class="text-right"><span class="opacity-50">SPENT:</span> ₹<span id="display-spent">0</span></div>
                </div>
            </div>

            <!-- Quick Add -->
            <div class="space-y-3">
                <input type="number" id="budget-input" placeholder="Update Monthly Budget" class="w-full p-3 rounded-xl bg-gray-50 border border-gray-100 text-sm outline-none focus:border-slate-400">
                <button onclick="updateBudget()" class="w-full bg-slate-200 text-slate-800 py-2 rounded-xl text-xs font-bold uppercase tracking-wider mb-4">Set Budget</button>
                
                <form id="expense-form" class="space-y-3">
                    <input type="text" id="item-name" placeholder="Where did it go? (e.g. Coffee)" class="w-full p-3 rounded-xl border border-gray-200 text-sm outline-none shadow-sm" required>
                    <div class="flex gap-2">
                        <input type="number" id="item-amount" placeholder="Amount" class="w-full p-3 rounded-xl border border-gray-200 text-sm outline-none shadow-sm" required>
                        <button type="submit" class="bg-slate-900 text-white px-8 rounded-xl font-bold text-sm shadow-lg">ADD</button>
                    </div>
                </form>
            </div>

            <!-- List -->
            <div id="expense-list" class="mt-8 space-y-3 max-h-60 overflow-y-auto"></div>

            <button onclick="clearData()" class="mt-8 w-full text-[9px] text-gray-300 tracking-[.2em] uppercase">Reset All Data</button>
        </div>
    </div>

    <script>
        let budget = parseFloat(localStorage.getItem('pb_v4_budget')) || 0;
        let expenses = JSON.parse(localStorage.getItem('pb_v4_expenses')) || [];

        function updateUI() {
            const list = document.getElementById('expense-list');
            list.innerHTML = '';
            let totalSpent = 0;

            expenses.forEach((item) => {
                totalSpent += parseFloat(item.amount);
                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-white p-4 rounded-2xl border border-gray-50 shadow-sm";
                div.innerHTML = `
                    <div>
                        <p class="font-bold text-slate-800 text-sm">${item.name}</p>
                        <p class="text-[10px] text-gray-400">${item.date}</p>
                    </div>
                    <div class="text-red-500 font-bold text-sm">-₹${parseFloat(item.amount).toLocaleString('en-IN')}</div>
                `;
                list.appendChild(div);
            });

            document.getElementById('display-budget').innerText = budget.toLocaleString('en-IN');
            document.getElementById('display-spent').innerText = totalSpent.toLocaleString('en-IN');
            document.getElementById('display-remaining').innerText = (budget - totalSpent).toLocaleString('en-IN');
            
            localStorage.setItem('pb_v4_expenses', JSON.stringify(expenses));
            localStorage.setItem('pb_v4_budget', budget);
        }

        function updateBudget() {
            const val = document.getElementById('budget-input').value;
            if(val) { budget = parseFloat(val); document.getElementById('budget-input').value = ''; updateUI(); }
        }

        document.getElementById('expense-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('item-name').value;
            const amount = document.getElementById('item-amount').value;
            expenses.unshift({ name, amount, date: new Date().toLocaleDateString('en-IN', {day:'2-digit', month:'short'}) });
            e.target.reset();
            updateUI();
        });

        function clearData() { if(confirm("Clear everything?")) { expenses = []; budget = 0; updateUI(); } }
        updateUI();
    </script>
</body>
</html>

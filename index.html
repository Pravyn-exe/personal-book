<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Personal Book</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%23111827%22/><text y=%22.9em%22 x=%22.28em%22 font-size=%2255%22>💰</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass-card { background: white; border-radius: 32px; box-shadow: 0 10px 40px rgba(0,0,0,0.06); }
        .tab-active { border-bottom: 3px solid #0f172a; color: #0f172a; }
    </style>
</head>
<body class="p-4">
    <div class="max-w-md mx-auto mt-4">
        <div class="glass-card p-6 min-h-[80vh] flex flex-col">
            <!-- Header -->
            <div class="flex items-center gap-3 mb-6">
                <div class="bg-slate-900 text-white w-10 h-10 rounded-full flex items-center justify-center font-bold text-xl">💰</div>
                <h1 class="text-2xl font-black text-slate-900 tracking-tighter">Personal Book</h1>
            </div>

            <!-- Navigation Tabs -->
            <div class="flex border-b border-slate-100 mb-6 text-sm font-bold text-slate-400">
                <button onclick="switchTab('spending')" id="tab-spending" class="flex-1 py-3 tab-active">DAILY SPEND</button>
                <button onclick="switchTab('lending')" id="tab-lending" class="flex-1 py-3">LENDING</button>
            </div>

            <!-- DAILY SPENDING SECTION -->
            <div id="section-spending" class="space-y-6">
                <div class="bg-slate-950 rounded-3xl p-6 text-white shadow-xl">
                    <p class="text-[10px] opacity-60 uppercase tracking-widest font-bold">Remaining Balance</p>
                    <div class="text-4xl font-bold mt-1">₹<span id="display-remaining">0</span></div>
                </div>
                
                <form id="expense-form" class="space-y-3">
                    <input type="text" id="item-name" placeholder="What did you buy?" class="w-full p-4 rounded-2xl bg-slate-50 border-none text-sm outline-none" required>
                    <div class="flex gap-2">
                        <input type="number" id="item-amount" placeholder="Amount (₹)" class="w-full p-4 rounded-2xl bg-slate-50 border-none text-sm outline-none" required>
                        <button type="submit" class="bg-slate-900 text-white px-8 rounded-2xl font-bold text-sm">ADD</button>
                    </div>
                </form>
                <div id="expense-list" class="space-y-3 overflow-y-auto max-h-60"></div>
            </div>

            <!-- LENDING SECTION -->
            <div id="section-lending" class="hidden space-y-6">
                <div class="bg-indigo-900 rounded-3xl p-6 text-white shadow-xl">
                    <p class="text-[10px] opacity-60 uppercase tracking-widest font-bold">Total Lent Out</p>
                    <div class="text-4xl font-bold mt-1">₹<span id="display-lent">0</span></div>
                </div>

                <form id="lending-form" class="space-y-3">
                    <input type="text" id="borrower-name" placeholder="Who borrowed money?" class="w-full p-4 rounded-2xl bg-indigo-50 border-none text-sm outline-none" required>
                    <div class="flex gap-2">
                        <input type="number" id="lent-amount" placeholder="Amount (₹)" class="w-full p-4 rounded-2xl bg-indigo-50 border-none text-sm outline-none" required>
                        <button type="submit" class="bg-indigo-600 text-white px-8 rounded-2xl font-bold text-sm">LENT</button>
                    </div>
                </form>
                <div id="lending-list" class="space-y-3 overflow-y-auto max-h-60"></div>
            </div>

            <button onclick="clearData()" class="mt-auto pt-8 w-full text-[9px] text-slate-300 tracking-[.3em] uppercase">Reset All Data</button>
        </div>
    </div>

    <script>
        let budget = parseFloat(localStorage.getItem('pb_v8_budget')) || 5000;
        let expenses = JSON.parse(localStorage.getItem('pb_v8_expenses')) || [];
        let lending = JSON.parse(localStorage.getItem('pb_v8_lending')) || [];

        function switchTab(tab) {
            document.getElementById('section-spending').classList.toggle('hidden', tab !== 'spending');
            document.getElementById('section-lending').classList.toggle('hidden', tab !== 'lending');
            document.getElementById('tab-spending').className = tab === 'spending' ? 'flex-1 py-3 tab-active' : 'flex-1 py-3';
            document.getElementById('tab-lending').className = tab === 'lending' ? 'flex-1 py-3 tab-active' : 'flex-1 py-3';
        }

        function updateUI() {
            // Spending Logic
            const exList = document.getElementById('expense-list');
            exList.innerHTML = '';
            let spent = 0;
            expenses.forEach(i => {
                spent += parseFloat(i.amount);
                exList.innerHTML += `<div class="flex justify-between p-4 bg-white rounded-2xl border border-slate-50 shadow-sm text-sm">
                    <div><b>${i.name}</b><br><small class="text-slate-400">${i.date}</small></div>
                    <div class="text-red-500 font-bold">-₹${i.amount}</div>
                </div>`;
            });
            document.getElementById('display-remaining').innerText = (budget - spent).toLocaleString('en-IN');

            // Lending Logic
            const lenList = document.getElementById('lending-list');
            lenList.innerHTML = '';
            let totalLent = 0;
            lending.forEach((i, idx) => {
                totalLent += parseFloat(i.amount);
                lenList.innerHTML += `<div class="flex justify-between items-center p-4 bg-indigo-50 rounded-2xl text-sm">
                    <div><b class="text-indigo-900">${i.name}</b><br><small class="text-indigo-400">Lent on ${i.date}</small></div>
                    <div class="flex items-center gap-3">
                        <span class="font-bold text-indigo-700">₹${i.amount}</span>
                        <button onclick="markPaid(${idx})" class="text-[10px] bg-indigo-600 text-white px-2 py-1 rounded-md">PAID</button>
                    </div>
                </div>`;
            });
            document.getElementById('display-lent').innerText = totalLent.toLocaleString('en-IN');

            localStorage.setItem('pb_v8_expenses', JSON.stringify(expenses));
            localStorage.setItem('pb_v8_lending', JSON.stringify(lending));
        }

        document.getElementById('expense-form').onsubmit = (e) => {
            e.preventDefault();
            expenses.unshift({ name: document.getElementById('item-name').value, amount: document.getElementById('item-amount').value, date: new Date().toLocaleDateString('en-IN') });
            e.target.reset(); updateUI();
        };

        document.getElementById('lending-form').onsubmit = (e) => {
            e.preventDefault();
            lending.unshift({ name: document.getElementById('borrower-name').value, amount: document.getElementById('lent-amount').value, date: new Date().toLocaleDateString('en-IN') });
            e.target.reset(); updateUI();
        };

        function markPaid(index) {
            lending.splice(index, 1);
            updateUI();
        }

        function clearData() { if(confirm("Clear everything?")) { expenses = []; lending = []; budget = 0; updateUI(); } }
        updateUI();
    </script>
</body>
</html>
